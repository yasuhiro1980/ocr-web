<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>英数字・ハイフン専用 カメラOCR v2</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --sub: #94a3b8;
      --accent: #38bdf8;
      --primary: #0284c7;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    header {
      padding: 10px 14px;
      background: rgba(30, 41, 59, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header h1 { font-size: 15px; font-weight: 700; }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #334155;
      color: var(--sub);
      font-weight: 600;
    }
    .badge.ready { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge.busy { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 12px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    /* カメラビュー */
    .cam-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    .roi {
      width: 82%;
      height: 64px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      position: relative;
      transition: border-color 0.2s, width 0.2s, height 0.2s;
    }
    .roi.detected { border-color: var(--ok); }
    .roi-label {
      position: absolute;
      top: -22px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: #fff;
      text-shadow: 0 1px 3px #000;
    }

    /* ズーム＆前処理クイックバー */
    .quick-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      align-items: center;
      font-size: 12px;
    }
    .quick-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .quick-item label {
      color: var(--sub);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 12px;
      width: 100%;
    }

    /* OCR入力プレビュー（実際に認識エンジンに渡される画像） */
    .preview-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .preview-hd {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--sub);
    }
    canvas#procCanvas {
      width: 100%;
      height: 52px;
      object-fit: contain;
      background: #fff;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    /* ボタン群 */
    .controls {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 8px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled { opacity: 0.5; }
    .btn-pri { background: var(--primary); color: #fff; }
    .btn-sec { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-ok { background: var(--ok); color: #052e16; }
    .btn-auto.active {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--ok);
      color: #4ade80;
    }

    /* 結果カード */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--sub);
      font-weight: 600;
    }
    .res-group { display: flex; gap: 8px; }
    input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 18px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      letter-spacing: 0.08em;
    }
    .raw-row {
      font-size: 12px;
      color: var(--sub);
      font-family: ui-monospace, monospace;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--sub);
    }
    .pill strong { color: var(--accent); }

    details.card { padding: 0; overflow: hidden; }
    details summary {
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
    }
    details summary::-webkit-details-marker { display: none; }
    .settings-body {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid var(--border);
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: var(--sub); font-weight: 600; }
    .field input[type="text"] { font-size: 16px; padding: 8px 10px; }
    .hint { font-size: 11px; color: var(--sub); }
    .chk-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .hist-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
    }
    .hist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      background: #0f172a;
      border-radius: 8px;
      font-family: ui-monospace, monospace;
      font-size: 14px;
    }
    .hist-item button { padding: 4px 10px; font-size: 12px; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ok);
      color: #052e16;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>英数字・ハイフン カメラOCR v2</h1>
    <span id="statusBadge" class="badge">初期化中...</span>
  </header>

  <main>
    <!-- カメラプレビュー -->
    <div class="cam-wrap">
      <video id="video" playsinline autoplay muted></video>
      <div class="overlay">
        <div id="roiBox" class="roi">
          <div class="roi-label">20cmほど離してズームするとピントが合います</div>
        </div>
      </div>
    </div>

    <!-- ピント対策ズーム＆画像前処理モード切替 -->
    <div class="quick-bar">
      <div class="quick-item">
        <label for="zoomRange"><span>カメラ倍率（ピント対策）</span><span id="zoomVal">1.5x</span></label>
        <input type="range" id="zoomRange" min="1" max="3" step="0.1" value="1.5">
      </div>
      <div class="quick-item">
        <label for="prepMode"><span>画像処理モード</span></label>
        <select id="prepMode">
          <option value="norm" selected>標準（自動コントラスト補正）</option>
          <option value="otsu">くっきり白黒（二値化）</option>
          <option value="raw">無加工（画面・紙文字向け）</option>
          <option value="invert">白抜き文字反転（黒背景に白字）</option>
        </select>
      </div>
    </div>

    <!-- OCRに渡される切り出し画像のリアルタイム確認 -->
    <div class="preview-box">
      <div class="preview-hd">
        <span>OCR入力プレビュー（この画像が鮮明に見えるよう距離を調整）</span>
        <span id="psmLabel">認識モード: ブロック(PSM 6)</span>
      </div>
      <canvas id="procCanvas" width="400" height="100"></canvas>
    </div>

    <!-- 操作ボタン -->
    <div class="controls">
      <button id="scanBtn" class="btn-pri" disabled>📸 1回読み取り</button>
      <button id="autoBtn" class="btn-sec btn-auto" disabled>連続スキャン: OFF</button>
    </div>

    <!-- 結果表示 -->
    <div class="card">
      <div class="card-hd">
        <span>読み取り結果（1文字から認識・タップで編集可）</span>
        <span id="confidenceText">信頼度: --%</span>
      </div>
      <div class="res-group">
        <input type="text" id="resultInput" placeholder="ここに結果が表示されます" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        <button id="copyBtn" class="btn-ok" style="white-space: nowrap;">コピー</button>
      </div>
      <div class="raw-row">
        <span id="rawText">OCR生テキスト: --</span>
        <span id="validationStatus"></span>
      </div>
      <div class="pills" id="activeRulePills"></div>
    </div>

    <!-- 詳細ルール設定 -->
    <details class="card">
      <summary>
        <span>文字ルール・認識モード詳細設定</span>
        <span style="font-size: 12px; color: var(--accent);">開く ▼</span>
      </summary>
      <div class="settings-body">
        <div class="field">
          <label for="psmSelect">文字レイアウト認識モード（PSM）</label>
          <select id="psmSelect">
            <option value="6" selected>PSM 6: 単一ブロック（汎用・一番読める設定）</option>
            <option value="7">PSM 7: 1行の文字列として認識</option>
            <option value="8">PSM 8: 1単語・1文字列として認識</option>
            <option value="11">PSM 11: まばらな文字（1文字や刻印向け）</option>
          </select>
        </div>

        <div class="field">
          <label for="excludedChars">使用しない英字（連続入力）</label>
          <input type="text" id="excludedChars" value="IO" autocapitalize="characters">
          <span class="hint">例: IO を指定すると I と O を最終結果から除外します。</span>
        </div>

        <div class="field">
          <label for="replaceMap">類似文字の自動置換ルール（カンマ区切り）</label>
          <input type="text" id="replaceMap" value="I:1,l:1,|:1,O:0,o:0">
          <span class="hint">例: I:1,l:1,O:0（OCRが I や O と読んだ文字を数字に変換します）。</span>
        </div>

        <div class="field">
          <label for="regexPattern">フォーマット正規表現チェック（任意）</label>
          <input type="text" id="regexPattern" placeholder="例: ^[A-Z0-9]{4}-[A-Z0-9]{2,4}$">
        </div>

        <label class="chk-row">
          <input type="checkbox" id="uppercaseOnly" checked>
          <span>英字は大文字のみ許可（小文字を大文字に自動変換）</span>
        </label>

        <button id="applyRulesBtn" class="btn-sec">設定を保存して反映</button>
      </div>
    </details>

    <!-- 履歴 -->
    <div class="card">
      <div class="card-hd">
        <span>読み取り履歴</span>
        <button id="clearHistoryBtn" class="btn-sec" style="padding: 4px 8px; font-size: 11px;">クリア</button>
      </div>
      <ul id="historyList" class="hist-list"></ul>
    </div>
  </main>

  <div id="toast" class="toast">コピーしました</div>

  <script>
    const DEFAULT_CONFIG = {
      excludedChars: 'IO',
      replaceMapStr: 'I:1,l:1,|:1,O:0,o:0',
      regexPattern: '',
      uppercaseOnly: true,
      prepMode: 'norm',
      psm: '6',
      zoom: 1.5
    };

    const video = document.getElementById('video');
    const roiBox = document.getElementById('roiBox');
    const statusBadge = document.getElementById('statusBadge');
    const scanBtn = document.getElementById('scanBtn');
    const autoBtn = document.getElementById('autoBtn');
    const resultInput = document.getElementById('resultInput');
    const copyBtn = document.getElementById('copyBtn');
    const rawTextEl = document.getElementById('rawText');
    const confidenceText = document.getElementById('confidenceText');
    const validationStatus = document.getElementById('validationStatus');
    const activeRulePills = document.getElementById('activeRulePills');
    const historyList = document.getElementById('historyList');
    const procCanvas = document.getElementById('procCanvas');
    const toast = document.getElementById('toast');

    const zoomRange = document.getElementById('zoomRange');
    const zoomVal = document.getElementById('zoomVal');
    const prepModeSelect = document.getElementById('prepMode');
    const psmSelect = document.getElementById('psmSelect');
    const psmLabel = document.getElementById('psmLabel');
    const excludedCharsInput = document.getElementById('excludedChars');
    const replaceMapInput = document.getElementById('replaceMap');
    const regexPatternInput = document.getElementById('regexPattern');
    const uppercaseOnlyInput = document.getElementById('uppercaseOnly');
    const applyRulesBtn = document.getElementById('applyRulesBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    let worker = null;
    let isRecognizing = false;
    let autoScanTimer = null;
    let previewTimer = null;
    let historyItems = [];
    let currentZoom = 1.5;
    let hwZoomSupported = false;
    let videoTrack = null;

    function loadConfig() {
      try {
        const cfg = { ...DEFAULT_CONFIG, ...JSON.parse(localStorage.getItem('ocr_rule_config_v2') || '{}') };
        excludedCharsInput.value = cfg.excludedChars;
        replaceMapInput.value = cfg.replaceMapStr;
        regexPatternInput.value = cfg.regexPattern;
        uppercaseOnlyInput.checked = cfg.uppercaseOnly;
        prepModeSelect.value = cfg.prepMode || 'norm';
        psmSelect.value = cfg.psm || '6';
        currentZoom = parseFloat(cfg.zoom) || 1.5;
        zoomRange.value = currentZoom;
        zoomVal.textContent = currentZoom.toFixed(1) + 'x';
        return cfg;
      } catch (e) {
        return { ...DEFAULT_CONFIG };
      }
    }

    function getCurrentConfig() {
      return {
        excludedChars: (excludedCharsInput.value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''),
        replaceMapStr: (replaceMapInput.value || '').trim(),
        regexPattern: (regexPatternInput.value || '').trim(),
        uppercaseOnly: uppercaseOnlyInput.checked,
        prepMode: prepModeSelect.value,
        psm: psmSelect.value,
        zoom: currentZoom
      };
    }

    function buildFinalAllowedSet(cfg) {
      const ex = new Set(cfg.excludedChars.split(''));
      const up = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(c => !ex.has(c)).join('');
      const lo = cfg.uppercaseOnly ? '' : 'abcdefghijklmnopqrstuvwxyz'.split('').filter(c => !ex.has(c.toUpperCase())).join('');
      return new Set(('0123456789' + up + lo + '-').split(''));
    }

    function renderRulePills(cfg) {
      const pills = [
        `<span class="pill">許可: <strong>英数字 + ハイフン(-)</strong></span>`,
        `<span class="pill">除外文字: <strong>${cfg.excludedChars || 'なし'}</strong></span>`
      ];
      if (cfg.replaceMapStr) pills.push(`<span class="pill">自動補正: <strong>${cfg.replaceMapStr}</strong></span>`);
      if (cfg.regexPattern) pills.push(`<span class="pill">形式: <strong>${cfg.regexPattern}</strong></span>`);
      activeRulePills.innerHTML = pills.join('');
      psmLabel.textContent = `認識モード: PSM ${cfg.psm}`;
    }

    // OCR生テキストに対して置換ルール＆除外文字ルールを適用
    function applyCharacterRules(rawStr, cfg) {
      if (!rawStr) return '';
      // 複数行ある場合は最も英数字が多い行を優先しつつ改行をスペース化
      const lines = rawStr.split(/[
]+/).map(l => l.trim()).filter(Boolean);
      let bestLine = lines.join('');
      if (lines.length > 1) {
        lines.sort((a, b) => (b.replace(/[^A-Za-z0-9-]/g, '').length) - (a.replace(/[^A-Za-z0-9-]/g, '').length));
        bestLine = lines[0];
      }

      let s = bestLine.replace(/[ー−―–—‐_]/g, '-').replace(/\s+/g, '');

      // 1. 類似文字の自動置換（除外判定の前に I->1, O->0 などを変換）
      if (cfg.replaceMapStr) {
        for (const pair of cfg.replaceMapStr.split(',')) {
          const idx = pair.indexOf(':');
          if (idx > 0) {
            const f = pair.slice(0, idx).trim();
            const t = pair.slice(idx + 1).trim();
            if (f) s = s.split(f).join(t);
          }
        }
      }

      // 2. 大文字統一
      if (cfg.uppercaseOnly) {
        s = s.toUpperCase();
      }

      // 3. 許可された文字（英数字・ハイフン かつ 除外文字以外）のみ抽出
      const allowed = buildFinalAllowedSet(cfg);
      s = s.split('').filter(ch => allowed.has(ch)).join('');

      // 4. 連続ハイフン・先頭末尾ハイフンの整理
      return s.replace(/-+/g, '-').replace(/^-|-$/g, '');
    }

    // ズーム適用（ハードウェア対応時はカメラズーム、非対応時はCSS＆切り出しズーム）
    async function applyZoom(z) {
      currentZoom = parseFloat(z) || 1.0;
      zoomVal.textContent = currentZoom.toFixed(1) + 'x';
      if (videoTrack && hwZoomSupported) {
        try {
          await videoTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] });
          video.style.transform = 'scale(1)';
          return;
        } catch (e) {}
      }
      video.style.transform = `scale(${currentZoom})`;
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });
      video.srcObject = stream;
      await video.play();

      videoTrack = stream.getVideoTracks()[0];
      if (videoTrack && videoTrack.getCapabilities) {
        const caps = videoTrack.getCapabilities();
        if (caps && caps.zoom) {
          hwZoomSupported = true;
          zoomRange.min = caps.zoom.min || 1;
          zoomRange.max = Math.min(4, caps.zoom.max || 3);
        }
      }
      await applyZoom(currentZoom);
    }

    async function initOCR() {
      try {
        statusBadge.textContent = 'カメラ起動中...';
        await startCamera();

        // リアルタイムで切り出しプレビューを更新（ピント確認用）
        previewTimer = setInterval(() => {
          if (!isRecognizing) captureROI(getCurrentConfig().prepMode);
        }, 250);

        statusBadge.textContent = 'OCRエンジン読込中...';
        statusBadge.className = 'badge busy';

        worker = await Tesseract.createWorker('eng');
        await updateWorkerParams();

        statusBadge.textContent = '準備完了';
        statusBadge.className = 'badge ready';
        scanBtn.disabled = false;
        autoBtn.disabled = false;
      } catch (err) {
        console.error(err);
        statusBadge.textContent = 'エラー: カメラ許可を確認';
      }
    }

    async function updateWorkerParams() {
      const cfg = getCurrentConfig();
      localStorage.setItem('ocr_rule_config_v2', JSON.stringify(cfg));
      renderRulePills(cfg);
      if (!worker) return;
      // Tesseract側には大文字小文字の英数字＋ハイフンを渡し、I->1 置換や除外はJS後処理で行うことで認識落ちを防ぐ
      await worker.setParameters({
        tessedit_pageseg_mode: cfg.psm,
        tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-|'
      });
    }

    // ガイド枠（ROI）を切り出し、余白パディング＆適応型前処理を施す
    function captureROI(prepMode) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const cRect = video.getBoundingClientRect();
      const rRect = roiBox.getBoundingClientRect();

      // CSS拡大も含めた画面表示上の比率からビデオ内座標を算出
      const baseW = cRect.width / (hwZoomSupported ? 1 : currentZoom);
      const baseH = cRect.height / (hwZoomSupported ? 1 : currentZoom);
      const scale = Math.max(baseW / vw, baseH / vh);

      // 画面中心からのオフセット
      const centerX = vw / 2;
      const centerY = vh / 2;
      const roiW_video = (rRect.width / (hwZoomSupported ? 1 : currentZoom)) / scale;
      const roiH_video = (rRect.height / (hwZoomSupported ? 1 : currentZoom)) / scale;

      const cropX = Math.max(0, Math.floor(centerX - roiW_video / 2));
      const cropY = Math.max(0, Math.floor(centerY - roiH_video / 2));
      const cropW = Math.min(vw - cropX, Math.floor(roiW_video));
      const cropH = Math.min(vh - cropY, Math.floor(roiH_video));

      if (cropW <= 10 || cropH <= 10) return null;

      // Tesseractが最も認識しやすい高さ（中身90px＋上下左右に20pxの白余白）に正規化
      const targetInnerH = 90;
      const targetInnerW = Math.round((cropW / cropH) * targetInnerH);
      const pad = 20;

      procCanvas.width = targetInnerW + pad * 2;
      procCanvas.height = targetInnerH + pad * 2;
      const ctx = procCanvas.getContext('2d', { willReadFrequently: true });

      // 背景を白で塗りつぶす（Tesseractは周囲に白余白があると認識精度が大幅に向上する）
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, procCanvas.width, procCanvas.height);

      // 中央にROI画像を描画
      ctx.drawImage(video, cropX, cropY, cropW, cropH, pad, pad, targetInnerW, targetInnerH);

      if (prepMode !== 'raw') {
        const imgData = ctx.getImageData(pad, pad, targetInnerW, targetInnerH);
        const d = imgData.data;
        const len = targetInnerW * targetInnerH;
        const grays = new Uint8Array(len);

        let minG = 255, maxG = 0;
        for (let i = 0, p = 0; i < d.length; i += 4, p++) {
          let g = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
          if (prepMode === 'invert') g = 255 - g;
          grays[p] = g;
          if (g < minG) minG = g;
          if (g > maxG) maxG = g;
        }

        const range = Math.max(1, maxG - minG);

        if (prepMode === 'norm' || prepMode === 'invert') {
          // 自動ヒストグラム正規化＋ガンマ補正（照明ムラに強い）
          for (let i = 0, p = 0; i < d.length; i += 4, p++) {
            let norm = ((grays[p] - minG) / range) * 255;
            // 文字を濃く、背景を白く飛ばすシグモイド風コントラスト
            norm = norm < 140 ? Math.max(0, norm * 0.75) : Math.min(255, norm * 1.15);
            d[i] = d[i + 1] = d[i + 2] = Math.round(norm);
          }
        } else if (prepMode === 'otsu') {
          // Otsuの自動二値化
          const hist = new Int32Array(256);
          for (let p = 0; p < len; p++) {
            const norm = Math.round(((grays[p] - minG) / range) * 255);
            grays[p] = norm;
            hist[norm]++;
          }
          let sum = 0;
          for (let t = 0; t < 256; t++) sum += t * hist[t];
          let sumB = 0, wB = 0, maxVar = 0, threshold = 128;
          for (let t = 0; t < 256; t++) {
            wB += hist[t];
            if (wB === 0) continue;
            const wF = len - wB;
            if (wF === 0) break;
            sumB += t * hist[t];
            const mB = sumB / wB;
            const mF = (sum - sumB) / wF;
            const between = wB * wF * (mB - mF) * (mB - mF);
            if (between > maxVar) {
              maxVar = between;
              threshold = t;
            }
          }
          for (let i = 0, p = 0; i < d.length; i += 4, p++) {
            const v = grays[p] < threshold ? 0 : 255;
            d[i] = d[i + 1] = d[i + 2] = v;
          }
        }
        ctx.putImageData(imgData, pad, pad);
      }

      return procCanvas;
    }

    async function performScan(isAuto = false) {
      if (!worker || isRecognizing) return;
      const cfg = getCurrentConfig();
      const canvas = captureROI(cfg.prepMode);
      if (!canvas) return;

      isRecognizing = true;
      if (!isAuto) {
        statusBadge.textContent = '解析中...';
        statusBadge.className = 'badge busy';
      }

      try {
        const { data } = await worker.recognize(canvas);
        const raw = (data.text || '').trim();
        const filtered = applyCharacterRules(raw, cfg);
        const conf = Math.round(data.confidence || 0);

        rawTextEl.textContent = `OCR生テキスト: ${raw.replace(/[
]+/g, ' ') || '(検出なし)'}`;
        confidenceText.textContent = `信頼度: ${conf}%`;

        // 1文字以上認識できていれば結果に反映
        if (filtered.length >= 1) {
          let isValid = true;
          if (cfg.regexPattern) {
            try {
              isValid = new RegExp(cfg.regexPattern).test(filtered);
            } catch (e) {}
          }

          if (isValid) {
            validationStatus.textContent = '✓ 認識成功';
            validationStatus.style.color = '#4ade80';
            roiBox.classList.add('detected');
            setTimeout(() => roiBox.classList.remove('detected'), 400);

            // 連続スキャン時でも信頼度45%以上なら即時表示
            if (!isAuto || conf >= 45) {
              resultInput.value = filtered;
              addHistory(filtered);
            }
          } else {
            validationStatus.textContent = '⚠ 形式不一致';
            validationStatus.style.color = '#fbbf24';
            if (!isAuto) resultInput.value = filtered;
          }
        } else if (!isAuto) {
          validationStatus.textContent = '文字が見つかりません（プレビューを確認）';
          validationStatus.style.color = '#f87171';
        }
      } catch (e) {
        console.error(e);
      } finally {
        isRecognizing = false;
        statusBadge.textContent = autoScanTimer ? '連続スキャン中' : '準備完了';
        statusBadge.className = 'badge ready';
      }
    }

    function addHistory(text) {
      if (!text || historyItems[0] === text) return;
      historyItems.unshift(text);
      if (historyItems.length > 20) historyItems.pop();
      renderHistory();
    }

    function renderHistory() {
      if (historyItems.length === 0) {
        historyList.innerHTML = '<li class="hist-item" style="color:var(--sub);font-family:sans-serif;">まだ履歴はありません</li>';
        return;
      }
      historyList.innerHTML = historyItems.map(item => `
        <li class="hist-item">
          <span>${item}</span>
          <button class="btn-sec" onclick="copyText('${item}')">コピー</button>
        </li>
      `).join('');
    }

    window.copyText = async function(text) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1500);
      } catch (e) {
        resultInput.select();
        document.execCommand('copy');
      }
    };

    zoomRange.addEventListener('input', (e) => applyZoom(e.target.value));
    prepModeSelect.addEventListener('change', () => {
      const cfg = getCurrentConfig();
      localStorage.setItem('ocr_rule_config_v2', JSON.stringify(cfg));
      captureROI(cfg.prepMode);
    });
    psmSelect.addEventListener('change', () => updateWorkerParams());

    scanBtn.addEventListener('click', () => performScan(false));
    autoBtn.addEventListener('click', () => {
      if (autoScanTimer) {
        clearInterval(autoScanTimer);
        autoScanTimer = null;
        autoBtn.textContent = '連続スキャン: OFF';
        autoBtn.classList.remove('active');
        statusBadge.textContent = '準備完了';
      } else {
        autoScanTimer = setInterval(() => performScan(true), 900);
        autoBtn.textContent = '連続スキャン: ON';
        autoBtn.classList.add('active');
        statusBadge.textContent = '連続スキャン中';
      }
    });

    copyBtn.addEventListener('click', () => window.copyText(resultInput.value));
    applyRulesBtn.addEventListener('click', async () => {
      await updateWorkerParams();
      toast.textContent = '設定を更新しました';
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
        toast.textContent = 'コピーしました';
      }, 1500);
    });
    clearHistoryBtn.addEventListener('click', () => {
      historyItems = [];
      renderHistory();
    });

    renderRulePills(loadConfig());
    renderHistory();
    window.addEventListener('DOMContentLoaded', initOCR);
  </script>
</body>
</html>
