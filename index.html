<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>英数字・ハイフン専用 カメラOCR</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --accent-strong: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    header {
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #334155;
      color: var(--subtext);
      font-weight: 600;
    }
    .status-badge.ready {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }
    .status-badge.busy {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    /* Camera Viewfinder */
    .camera-container {
      position: relative;
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.45);
    }
    /* Guide Box (ROI) */
    .roi-box {
      width: 86%;
      height: 72px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      position: relative;
      background: transparent;
      transition: border-color 0.2s;
    }
    .roi-box.detected {
      border-color: var(--success);
    }
    .roi-label {
      position: absolute;
      top: -24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .camera-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--accent-strong);
      color: #fff;
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-success {
      background: var(--success);
      color: #052e16;
    }
    .btn-Auto.active {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--success);
      color: #4ade80;
    }
    /* Result Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--subtext);
      font-weight: 600;
    }
    .result-input-group {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.08em;
    }
    .raw-preview {
      font-size: 12px;
      color: var(--subtext);
      font-family: ui-monospace, SFMono-Regular, monospace;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
    }
    .rule-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--subtext);
    }
    .pill strong {
      color: var(--accent);
    }
    /* Settings Accordion */
    details.card {
      padding: 0;
      overflow: hidden;
    }
    details summary {
      padding: 13px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    details summary::-webkit-details-marker {
      display: none;
    }
    .settings-body {
      padding: 0 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field label {
      font-size: 12px;
      color: var(--subtext);
      font-weight: 600;
    }
    .field input[type="text"] {
      font-size: 16px;
      padding: 8px 10px;
      letter-spacing: 0.04em;
    }
    .field-hint {
      font-size: 11px;
      color: var(--subtext);
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .checkbox-row input {
      width: 18px;
      height: 18px;
    }
    /* History List */
    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #0f172a;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 14px;
    }
    .history-item button {
      padding: 4px 10px;
      font-size: 12px;
    }
    canvas#procCanvas {
      display: none;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #052e16;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>英数字・ハイフン カメラOCR</h1>
    <span id="statusBadge" class="status-badge">初期化中...</span>
  </header>

  <main>
    <!-- カメラプレビュー -->
    <div class="camera-container">
      <video id="video" playsinline autoplay muted></video>
      <div class="overlay">
        <div id="roiBox" class="roi-box">
          <div class="roi-label">枠内に文字列を合わせてください</div>
        </div>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="camera-controls">
      <button id="scanBtn" class="btn-primary" disabled>1回読み取り</button>
      <button id="autoBtn" class="btn-secondary btn-Auto" disabled>連続スキャン: OFF</button>
    </div>

    <!-- 読み取り結果 -->
    <div class="card">
      <div class="card-header">
        <span>読み取り結果（タップして編集可能）</span>
        <span id="confidenceText">信頼度: --%</span>
      </div>
      <div class="result-input-group">
        <input type="text" id="resultInput" placeholder="ここに結果が表示されます" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        <button id="copyBtn" class="btn-success" style="white-space: nowrap;">コピー</button>
      </div>
      <div class="raw-preview">
        <span id="rawText">生データ: --</span>
        <span id="validationStatus"></span>
      </div>
      <div class="rule-pills" id="activeRulePills"></div>
    </div>

    <!-- 文字ルール・フィルター設定 -->
    <details class="card">
      <summary>
        <span>文字ルール・除外設定</span>
        <span style="font-size: 12px; color: var(--accent);">変更 ▼</span>
      </summary>
      <div class="settings-body">
        <div class="field">
          <label for="excludedChars">使用しない英字（カンマ不要・連続入力）</label>
          <input type="text" id="excludedChars" value="IO" autocapitalize="characters">
          <span class="field-hint">例: <code>IO</code> を指定すると <code>I</code> と <code>O</code> をOCR候補から除外します。</span>
        </div>

        <div class="field">
          <label for="replaceMap">類似文字の自動置換ルール（任意）</label>
          <input type="text" id="replaceMap" value="I:1,l:1,O:0,o:0">
          <span class="field-hint">カンマ区切りで <code>誤認識文字:変換後</code> を指定（除外前に置換されます）。</span>
        </div>

        <div class="field">
          <label for="regexPattern">フォーマット正規表現チェック（任意）</label>
          <input type="text" id="regexPattern" placeholder="例: ^[A-Z0-9]{4}-[A-Z0-9]{2,4}$">
          <span class="field-hint">指定すると、形式に一致したときのみ確定・通知します。</span>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="uppercaseOnly" checked>
          <span>英字は大文字のみ許可（小文字を大文字に統一）</span>
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="highContrast" checked>
          <span>高コントラスト前処理（刻印・ラベル向けに二値化強調）</span>
        </label>

        <button id="applyRulesBtn" class="btn-secondary">設定を保存してOCRエンジンに反映</button>
      </div>
    </details>

    <!-- 読み取り履歴 -->
    <div class="card">
      <div class="card-header">
        <span>読み取り履歴</span>
        <button id="clearHistoryBtn" class="btn-secondary" style="padding: 4px 8px; font-size: 11px;">履歴クリア</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </div>
  </main>

  <canvas id="procCanvas"></canvas>
  <div id="toast" class="toast">コピーしました</div>

  <script>
    // ==========================================
    // デフォルト文字ルール設定（コード内で直接固定も可能）
    // ==========================================
    const DEFAULT_CONFIG = {
      excludedChars: 'IO',               // 使用しない文字（例: I, O）
      replaceMapStr: 'I:1,l:1,O:0,o:0',  // 誤認識しやすい文字の置換マップ
      regexPattern: '',                  // 例: '^[A-Z0-9]{4}-[A-Z0-9]+$'
      uppercaseOnly: true,
      highContrast: true
    };

    const video = document.getElementById('video');
    const roiBox = document.getElementById('roiBox');
    const statusBadge = document.getElementById('statusBadge');
    const scanBtn = document.getElementById('scanBtn');
    const autoBtn = document.getElementById('autoBtn');
    const resultInput = document.getElementById('resultInput');
    const copyBtn = document.getElementById('copyBtn');
    const rawTextEl = document.getElementById('rawText');
    const confidenceText = document.getElementById('confidenceText');
    const validationStatus = document.getElementById('validationStatus');
    const activeRulePills = document.getElementById('activeRulePills');
    const historyList = document.getElementById('historyList');
    const procCanvas = document.getElementById('procCanvas');
    const toast = document.getElementById('toast');

    const excludedCharsInput = document.getElementById('excludedChars');
    const replaceMapInput = document.getElementById('replaceMap');
    const regexPatternInput = document.getElementById('regexPattern');
    const uppercaseOnlyInput = document.getElementById('uppercaseOnly');
    const highContrastInput = document.getElementById('highContrast');
    const applyRulesBtn = document.getElementById('applyRulesBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    let worker = null;
    let isRecognizing = false;
    let autoScanTimer = null;
    let lastCandidate = '';
    let historyItems = [];

    // 設定の読み込み
    function loadConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem('ocr_rule_config') || '{}');
        const cfg = { ...DEFAULT_CONFIG, ...saved };
        excludedCharsInput.value = cfg.excludedChars;
        replaceMapInput.value = cfg.replaceMapStr;
        regexPatternInput.value = cfg.regexPattern;
        uppercaseOnlyInput.checked = cfg.uppercaseOnly;
        highContrastInput.checked = cfg.highContrast;
        return cfg;
      } catch (e) {
        return { ...DEFAULT_CONFIG };
      }
    }

    function getCurrentConfig() {
      return {
        excludedChars: (excludedCharsInput.value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''),
        replaceMapStr: (replaceMapInput.value || '').trim(),
        regexPattern: (regexPatternInput.value || '').trim(),
        uppercaseOnly: uppercaseOnlyInput.checked,
        highContrast: highContrastInput.checked
      };
    }

    // 許可文字（ホワイトリスト）の生成
    function buildWhitelist(cfg) {
      const baseDigits = '0123456789';
      const baseUpper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const baseLower = cfg.uppercaseOnly ? '' : 'abcdefghijklmnopqrstuvwxyz';
      const excludedSet = new Set(cfg.excludedChars.split(''));
      const allowedUpper = baseUpper.split('').filter(c => !excludedSet.has(c)).join('');
      const allowedLower = baseLower.split('').filter(c => !excludedSet.has(c.toUpperCase())).join('');
      return baseDigits + allowedUpper + allowedLower + '-';
    }

    function renderRulePills(cfg) {
      const pills = [
        `<span class="pill">許可: <strong>英数字 + ハイフン(-)</strong></span>`,
        `<span class="pill">除外文字: <strong>${cfg.excludedChars || 'なし'}</strong></span>`
      ];
      if (cfg.replaceMapStr) {
        pills.push(`<span class="pill">自動補正: <strong>${cfg.replaceMapStr}</strong></span>`);
      }
      if (cfg.regexPattern) {
        pills.push(`<span class="pill">形式: <strong>${cfg.regexPattern}</strong></span>`);
      }
      activeRulePills.innerHTML = pills.join('');
    }

    // OCR結果の事後フィルタリング＆ルール適用
    function applyCharacterRules(rawStr, cfg) {
      let s = (rawStr || '').trim();
      // 全角ハイフン・長音・ダッシュ類を半角ハイフンに統一
      s = s.replace(/[ー−―–—‐]/g, '-');
      // 空白を除去
      s = s.replace(/\s+/g, '');

      // 1. 置換マップ適用 (例: I->1, O->0)
      if (cfg.replaceMapStr) {
        const pairs = cfg.replaceMapStr.split(',');
        for (const pair of pairs) {
          const [fromChar, toChar] = pair.split(':').map(x => x ? x.trim() : '');
          if (fromChar && toChar !== undefined) {
            s = s.split(fromChar).join(toChar);
          }
        }
      }

      // 2. 大文字統一
      if (cfg.uppercaseOnly) {
        s = s.toUpperCase();
      }

      // 3. 許可された文字（英数字・ハイフン かつ 除外文字以外）のみ残す
      const whitelist = buildWhitelist(cfg);
      const allowedSet = new Set(whitelist.split(''));
      s = s.split('').filter(ch => allowedSet.has(ch)).join('');

      // 4. 連続するハイフンや先頭・末尾の不要なハイフンを整理
      s = s.replace(/-+/g, '-').replace(/^-|-$/g, '');

      return s;
    }

    // カメラ起動（iPhone Safari 背面カメラ対応）
    async function startCamera() {
      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();
    }

    // Tesseract.js 初期化
    async function initOCR() {
      try {
        statusBadge.textContent = 'カメラ起動中...';
        await startCamera();

        statusBadge.textContent = 'OCRエンジン準備中...';
        statusBadge.className = 'status-badge busy';

        worker = await Tesseract.createWorker('eng');
        await updateWorkerParams();

        statusBadge.textContent = '準備完了';
        statusBadge.className = 'status-badge ready';
        scanBtn.disabled = false;
        autoBtn.disabled = false;
      } catch (err) {
        console.error(err);
        statusBadge.textContent = 'エラー: カメラ許可またはHTTPSを確認';
        statusBadge.className = 'status-badge';
      }
    }

    async function updateWorkerParams() {
      const cfg = getCurrentConfig();
      localStorage.setItem('ocr_rule_config', JSON.stringify(cfg));
      renderRulePills(cfg);
      if (!worker) return;
      const whitelist = buildWhitelist(cfg);
      await worker.setParameters({
        tessedit_pageseg_mode: '7', // 1行の文字列として認識
        tessedit_char_whitelist: whitelist
      });
    }

    // ガイド枠（ROI）領域を切り出して前処理
    function captureROI(highContrast) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const containerRect = video.getBoundingClientRect();
      const roiRect = roiBox.getBoundingClientRect();

      // object-fit: cover の表示比率から実ビデオ座標へ変換
      const scale = Math.max(containerRect.width / vw, containerRect.height / vh);
      const renderedW = vw * scale;
      const renderedH = vh * scale;
      const offsetX = (renderedW - containerRect.width) / 2;
      const offsetY = (renderedH - containerRect.height) / 2;

      const relX = roiRect.left - containerRect.left + offsetX;
      const relY = roiRect.top - containerRect.top + offsetY;

      const cropX = Math.max(0, Math.floor(relX / scale));
      const cropY = Math.max(0, Math.floor(relY / scale));
      const cropW = Math.min(vw - cropX, Math.floor(roiRect.width / scale));
      const cropH = Math.min(vh - cropY, Math.floor(roiRect.height / scale));

      procCanvas.width = cropW;
      procCanvas.height = cropH;
      const ctx = procCanvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      if (highContrast) {
        const imgData = ctx.getImageData(0, 0, cropW, cropH);
        const d = imgData.data;
        // グレースケール＋コントラスト強調
        for (let i = 0; i < d.length; i += 4) {
          const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          const contrast = 1.6;
          const val = Math.min(255, Math.max(0, ((gray - 128) * contrast) + 128));
          d[i] = d[i + 1] = d[i + 2] = val;
        }
        ctx.putImageData(imgData, 0, 0);
      }
      return procCanvas;
    }

    // 1回スキャン実行
    async function performScan(isAuto = false) {
      if (!worker || isRecognizing) return;
      const cfg = getCurrentConfig();
      const canvas = captureROI(cfg.highContrast);
      if (!canvas) return;

      isRecognizing = true;
      if (!isAuto) {
        statusBadge.textContent = '解析中...';
        statusBadge.className = 'status-badge busy';
      }

      try {
        const { data } = await worker.recognize(canvas);
        const raw = (data.text || '').trim();
        const filtered = applyCharacterRules(raw, cfg);
        const conf = Math.round(data.confidence || 0);

        rawTextEl.textContent = `生データ: ${raw || '(なし)'}`;
        confidenceText.textContent = `信頼度: ${conf}%`;

        if (filtered.length >= 2) {
          let isValid = true;
          if (cfg.regexPattern) {
            try {
              const re = new RegExp(cfg.regexPattern);
              isValid = re.test(filtered);
            } catch (e) {
              isValid = true;
            }
          }

          if (isValid) {
            validationStatus.textContent = '✓ ルール適合';
            validationStatus.style.color = '#4ade80';
            roiBox.classList.add('detected');
            setTimeout(() => roiBox.classList.remove('detected'), 500);

            // 連続スキャン時は2回連続一致または手動スキャン時に確定
            if (!isAuto || filtered === lastCandidate) {
              resultInput.value = filtered;
              addHistory(filtered);
            }
            lastCandidate = filtered;
          } else {
            validationStatus.textContent = '⚠ 形式不一致';
            validationStatus.style.color = '#fbbf24';
            if (!isAuto) {
              resultInput.value = filtered;
            }
          }
        }
      } catch (e) {
        console.error(e);
      } finally {
        isRecognizing = false;
        statusBadge.textContent = autoScanTimer ? '連続スキャン中' : '準備完了';
        statusBadge.className = 'status-badge ready';
      }
    }

    function addHistory(text) {
      if (!text) return;
      if (historyItems[0] === text) return; // 直前と同じなら重複追加しない
      historyItems.unshift(text);
      if (historyItems.length > 20) historyItems.pop();
      renderHistory();
    }

    function renderHistory() {
      if (historyItems.length === 0) {
        historyList.innerHTML = '<li class="history-item" style="color: var(--subtext); font-family: sans-serif;">まだ履歴はありません</li>';
        return;
      }
      historyList.innerHTML = historyItems.map(item => `
        <li class="history-item">
          <span>${item}</span>
          <button class="btn-secondary" onclick="copyText('${item}')">コピー</button>
        </li>
      `).join('');
    }

    window.copyText = async function(text) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1600);
      } catch (e) {
        resultInput.select();
        document.execCommand('copy');
      }
    };

    // イベント登録
    scanBtn.addEventListener('click', () => performScan(false));

    autoBtn.addEventListener('click', () => {
      if (autoScanTimer) {
        clearInterval(autoScanTimer);
        autoScanTimer = null;
        autoBtn.textContent = '連続スキャン: OFF';
        autoBtn.classList.remove('active');
        statusBadge.textContent = '準備完了';
      } else {
        lastCandidate = '';
        autoScanTimer = setInterval(() => performScan(true), 1000);
        autoBtn.textContent = '連続スキャン: ON';
        autoBtn.classList.add('active');
        statusBadge.textContent = '連続スキャン中';
      }
    });

    copyBtn.addEventListener('click', () => window.copyText(resultInput.value));

    applyRulesBtn.addEventListener('click', async () => {
      applyRulesBtn.textContent = '反映中...';
      await updateWorkerParams();
      applyRulesBtn.textContent = '設定を保存してOCRエンジンに反映';
      toast.textContent = 'ルール設定を更新しました';
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
        toast.textContent = 'コピーしました';
      }, 1600);
    });

    clearHistoryBtn.addEventListener('click', () => {
      historyItems = [];
      renderHistory();
    });

    // 起動処理
    const initialCfg = loadConfig();
    renderRulePills(initialCfg);
    renderHistory();
    window.addEventListener('DOMContentLoaded', initOCR);
  </script>
</body>
</html>
